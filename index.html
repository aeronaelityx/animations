<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AELITYX Motion Studio</title></head>
<body><header><span class="logo">A✦</span><strong>AELITYX</strong><span class="divider"></span><span>Motion Studio</span><span class="local">Procesamiento local</span></header>
<main><section class="workspace"><div class="intro"><div><h1>Galería orbital</h1><p>Convierte tus imágenes en una secuencia de movimiento.</p></div><div class="pair"><select id="demoSet" aria-label="Colección de ejemplo"><option value="orbital">Órbitas</option><option value="terrain">Horizontes</option><option value="signal">Señales</option></select><button id="demo">Cargar demo</button></div></div>
<div id="stage"><div id="empty"><strong>Tu espiral empieza aquí</strong><p>Arrastra imágenes al escenario o impórtalas.</p></div></div>
<nav aria-label="Escenario"><button id="prev" aria-label="Anterior">←</button><button id="next" aria-label="Siguiente">→</button><button id="orbit" aria-pressed="false">Reproducir recorrido</button><button id="play">Previsualizar efecto</button></nav>
<div id="film" aria-label="Imágenes"></div></section>
<aside><h2>Edición</h2><label class="import">+ Importar imágenes<input id="files" type="file" multiple accept="image/*,.heic,.heif,.tif,.tiff"></label><div id="selected">Ninguna imagen seleccionada</div>
<label>Recorrido<select id="layout"><option value="helix">Hélice abierta</option><option value="bubbles">Burbujas</option><option value="slides">Diapositivas ←</option><option value="wave">Onda flotante</option></select></label><label>Separación<input id="spacing" type="range" min=".9" max="2.5" step=".05" value="1.35"></label><label class="check"><input id="layerEffects" type="checkbox" checked> Destacar cada imagen con su efecto</label><label>Efecto de esta imagen<select id="effect"></select></label><label>Intensidad<input id="strength" type="range" min="0.2" max="1.5" step="0.05" value="0.75"></label>
<div class="pair"><button id="random">Aleatorizar todas</button><button id="applyAll">Aplicar efecto a todas</button><button id="remove">Quitar imagen</button></div>
<label>Título de la imagen<input id="cardTitle" maxlength="52" placeholder="Título de la ficha"></label><label>Detalle<input id="cardDetail" maxlength="68" placeholder="Descripción breve"></label><h2>Estilo de grabación</h2><label>Acabado<select id="finish"><option value="studio">Estudio · luz suave</option><option value="flat">Plano · color sólido</option><option value="space">Cósmico · partículas</option></select></label><label>Color de fondo<input id="background" type="color" value="#171423"></label><h2>Exportación</h2><label>Encuadre<select id="ratio"><option value="1024,1024">1:1 · 1024 × 1024</option><option value="1080,1920">9:16 · 1080 × 1920</option><option value="1920,1080">16:9 · 1920 × 1080</option></select></label>
<label>Segundos por imagen<input id="duration" type="number" min="1" max="12" value="3"></label><label>Contenido<select id="scope"><option value="helix">Recorrido continuo</option><option value="all">Secuencia con efectos</option><option value="one">Imagen seleccionada</option></select></label>
<button class="primary" id="export">Descargar WebM</button><button id="webp">Descargar WebP de la tarjeta</button><p id="status" role="status"></p></aside></main>
<script type="module" src="/src.js"></script></body></html>
